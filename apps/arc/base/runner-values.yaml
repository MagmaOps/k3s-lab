# apps/arc/base/runner-values.yaml
githubConfigUrl: https://github.com/MagmaOps

githubConfigSecret: arc-github-token

runnerScaleSetName: arc-runners

minRunners: 2
maxRunners: 4

containerMode:
  type: "dind"

controllerServiceAccount:
  name: arc-controller-gha-rs-controller
  namespace: arc-systems

template:
  spec:
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:latest
        command:
          - /home/runner/run.sh
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: "2"
            memory: 4Gi
