apiVersion: apps/v1
kind: Deployment
metadata:
  name: url-shortener
  labels:
    app: url-shortener
spec:
  replicas: 1

  selector:
    matchLabels:
      app: url-shortener

  template:
    metadata:
      labels:
        app: url-shortener

    spec:
      containers:
        - name: url-shortener
          image: magmakomer/url-shortener:1.0.0

          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 512Mi

          ports:
            - containerPort: 8000

          env:
            - name: DATABASE_URL
              value: "postgresql+asyncpg://url_shortener_dev:url_shortener_dev@host.docker.internal:5433/url_shortener_local"

            - name: BASE_URL
              value: "http://localhost:8000"

            - name: LOG_LEVEL
              value: "INFO"
