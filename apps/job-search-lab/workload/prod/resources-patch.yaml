# apps/job-search-lab/workload/prod/resources-patch.yaml
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: jobsearch-api
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: api
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
