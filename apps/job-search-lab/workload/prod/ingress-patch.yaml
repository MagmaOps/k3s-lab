# apps/job-search-lab/workload/prod/ingress-patch.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jobsearch
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: jobsearch.lab.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: jobsearch-api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jobsearch-web
                port:
                  number: 3000
