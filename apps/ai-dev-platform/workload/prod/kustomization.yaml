# apps/ai-dev-platform/workload/prod/kustomization.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ai-development

resources:
  - git@github.com:MagmaOps/ai-dev-platform.git//k8s/base?ref=main
  - claude-dev-github-sealed.yaml
  - claude-dev-claude-sealed.yaml

images:
  - name: magmakomer/claude-dev
    newTag: 0.2.0

patches:
  - path: config-patch.yaml
    target:
      kind: ConfigMap
      name: claude-dev-config
