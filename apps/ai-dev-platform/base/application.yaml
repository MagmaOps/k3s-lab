# apps/ai-dev-platform/base/application.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-dev-platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default

  source:
    repoURL: git@github.com:MagmaOps/k3s-lab.git
    targetRevision: main
    path: apps/ai-dev-platform/workload/prod

  destination:
    server: https://kubernetes.default.svc
    namespace: ai-development

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
