# apps/world-cup-ladder/base/application.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: world-cup-ladder
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default

  source:
    repoURL: git@github.com:MagmaOps/k3s-lab.git
    targetRevision: main
    path: apps/world-cup-ladder/workload/prod

  destination:
    server: https://kubernetes.default.svc
    namespace: world-cup-ladder

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
