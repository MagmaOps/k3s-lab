# apps/world-cup-ladder/workload/prod/kustomization.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - git@github.com:MagmaOps/world-cup-ladder.git//k8s/base?ref=main
images:
  - name: world-cup-ladder
    newTag: 1.0.10
patches:
  - path: ingress-patch.yaml
    target:
      kind: Ingress
      name: world-cup-ladder
  - path: resources-patch.yaml
    target:
      kind: Deployment
      name: world-cup-ladder
