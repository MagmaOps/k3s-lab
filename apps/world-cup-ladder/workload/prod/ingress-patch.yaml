# apps/world-cup-ladder/workload/prod/ingress-patch.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: world-cup-ladder
spec:
  ingressClassName: nginx
  rules:
    - host: worldcupladder.lab.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: world-cup-ladder
                port:
                  number: 80
