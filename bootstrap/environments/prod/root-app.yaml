# bootstrap/environments/prod/root-app.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bootstrap
  namespace: argocd
spec:
  project: default

  source:
    repoURL: git@github.com:MagmaOps/k3s-lab.git
    targetRevision: refs/heads/main
    path: bootstrap/environments/prod

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
