# platform/nginx/values.yaml
controller:
  replicaCount: 2

  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      nodeTaintsPolicy: Honor
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: ingress-nginx
          app.kubernetes.io/instance: ingress-nginx
          app.kubernetes.io/component: controller

  ingressClassResource:
    name: nginx
    enabled: true
    default: false

  # TEMP: containerd default AppArmor profile blocks nginx reload signal after reboot (kernel 7.0.0-42,
  # containerd 2.2.3). Replace with a Localhost profile.
  containerSecurityContext:
    appArmorProfile:
      type: Unconfined

  service:
    type: LoadBalancer
    annotations:
      metallb.io/loadBalancerIPs: 192.168.1.240

  admissionWebhooks:
    enabled: true

  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      namespace: monitoring
      additionalLabels:
        release: kube-prometheus-stack

defaultBackend:
  enabled: false
