# platform/nginx/values.yaml
controller:
  replicaCount: 2

  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      nodeTaintsPolicy: Honor
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: ingress-nginx
          app.kubernetes.io/instance: ingress-nginx
          app.kubernetes.io/component: controller

  ingressClassResource:
    name: nginx
    enabled: true
    default: false

  # containerd's default AppArmor profile blocks the nginx reload signal after the reboot (kernel 7.0.0-42,
  # containerd 2.2.3, stacked label "//&unconfined"). Custom profile with the extra rules lives in
  # apparmor/k3s-ingress-nginx and is loaded on every node by ansible/site.yml. It must exist on a node
  # before a pod can start there (including k3s-w4 once it is back).
  containerSecurityContext:
    appArmorProfile:
      type: Localhost
      localhostProfile: k3s-ingress-nginx

  service:
    type: LoadBalancer
    annotations:
      metallb.io/loadBalancerIPs: 192.168.1.240

  admissionWebhooks:
    enabled: true

  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      namespace: monitoring
      additionalLabels:
        release: kube-prometheus-stack

defaultBackend:
  enabled: false
