# platform/reloader/base/reloader-app.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: reloader
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: default

  sources:
    - repoURL: https://stakater.github.io/stakater-charts
      chart: reloader
      targetRevision: 2.2.19
      helm:
        releaseName: reloader
        valueFiles:
          - $values/platform/reloader/base/values.yaml

    - repoURL: git@github.com:MagmaOps/k3s-lab.git
      targetRevision: refs/heads/main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: reloader

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
